
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern UI Design</title>
    <style>
        /* General Reset */
        body, h1, h2, h3, p, ul, li, a {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* Background Color (user-defined from the previous design) */
        body {
            font-family: Arial, sans-serif;
            background-color: #1E1E2F; /* Assuming this was the previous background color */
            color: #FFF;
            margin: 0;
            padding: 0;
        }

        /* Container for Cards */
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            padding: 20px;
        }

        /* Individual Cards */
        .card {
            background-color: #29293A; /* Card background slightly darker than body */
            border-radius: 15px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            max-width: 300px;
            color: #FFFFFF;
            text-align: center;
            transition: transform 0.3s ease-in-out;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        /* Card Image */
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        /* Card Content */
        .card-content {
            padding: 20px;
        }

        .card-content h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .card-content p {
            font-size: 1rem;
            color: #B3B3B3;
        }

        /* Buttons within Cards */
        .card-content .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #5C5CE0;
            color: #FFFFFF;
            font-size: 1rem;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        .card-content .btn:hover {
            background-color: #4A4ACC;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Card 1 -->
        <div class="card">
            <img src="https://via.placeholder.com/300x200" alt="Card Image 1">
            <div class="card-content">
                <h3>Card Title 1</h3>
                <p>Short description for card 1. Add more content as needed.</p>
                <a href="#" class="btn">Read More</a>
            </div>
        </div>
        <!-- Card 2 -->
        <div class="card">
            <img src="https://via.placeholder.com/300x200" alt="Card Image 2">
            <div class="card-content">
                <h3>Card Title 2</h3>
                <p>Short description for card 2. Customize content as needed.</p>
                <a href="#" class="btn">Learn More</a>
            </div>
        </div>
        <!-- Card 3 -->
        <div class="card">
            <img src="https://via.placeholder.com/300x200" alt="Card Image 3">
            <div class="card-content">
                <h3>Card Title 3</h3>
                <p>Another description here. Make it relevant to your project.</p>
                <a href="#" class="btn">Explore</a>
            </div>
        </div>
    </div>
</body>
</html>
